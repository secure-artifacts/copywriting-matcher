name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      id-token: write      # 用于获取 OIDC 令牌进行安全签名签名
      contents: write      # 用于发布文件
      attestations: write  # 用于生成 SLSA 证明

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install pyinstaller pandas openpyxl pywebview numpy scikit-learn sentence-transformers torch

      - name: Build Executable
        run: |
          pyinstaller --clean 爆贴文案查重与库存管理系统.spec

      - name: Prepare Artifact
        run: |
          mkdir dist_final
          copy dist\爆贴文案查重与库存管理系统.exe dist_final\

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist_final/*'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: copywriting-matcher-windows
          path: dist_final/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
